name: Deploy dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev-infra
  cancel-in-progress: true

env:
  TF_WORKING_DIR: terraform

jobs:
  apply-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-portfolio-tfstate" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=portfolio.tfstate"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply dev stack
        run: |
          terraform apply -auto-approve -input=false \
            -target=azurerm_resource_group.portfolio \
            -target=module.cosmos_shared \
            -target=module.sql_shared \
            -target=module.storage_shared \
            -target=module.keyvault_shared \
            -target=module.monitoring_shared \
            -target='module.env_stack["dev"]'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_owner_email: ${{ vars.OWNER_EMAIL }}
